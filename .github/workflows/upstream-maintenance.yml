name: Upstream Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *' # 北京时间次日 06:17
  workflow_run:
    workflows:
      - Run Data Sync
    types:
      - completed
    branches:
      - master

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-maintenance-master
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.repository == 'Nyox-x/running_page_kith' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed fork master
        uses: actions/checkout@v4
        with:
          repository: Nyox-x/running_page_kith
          ref: refs/heads/master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Monthly keepalive and inactivity-only enable
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAINTENANCE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: python .github/scripts/upstream_maintenance.py monthly

      - name: Merge official upstream
        id: merge
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAINTENANCE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: python .github/scripts/upstream_maintenance.py merge

      - name: Set up pnpm 8.9.0
        if: steps.merge.outputs.updated == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
          run_install: false

      - name: Set up Node 24
        if: steps.merge.outputs.updated == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        if: steps.merge.outputs.updated == 'true'
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-dev.txt

      - name: Verify merged source
        if: steps.merge.outputs.updated == 'true'
        run: |
          pnpm check
          pnpm exec eslint src --ext .ts,.tsx
          pnpm build
          python run_page/gpx_sync.py
          python -m black --check .
          python -m ruff check .

      - name: Commit, regular push, then dispatch data sync
        if: steps.merge.outputs.updated == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAINTENANCE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: python .github/scripts/upstream_maintenance.py publish

      - name: Re-run failed jobs once when no update exists
        if: >-
          steps.merge.outputs.updated != 'true' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.run_attempt == 1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAINTENANCE_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: >-
          python .github/scripts/upstream_maintenance.py rerun
          --run-id ${{ github.event.workflow_run.id }}
